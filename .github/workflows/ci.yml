name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@latest
      - name: Embed icon & version info
        run: go-winres make
      - name: Build
        run: go build -trimpath -ldflags="-s -w -H=windowsgui" -o ArtBayPublisher.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: ArtBayPublisher-windows-x64
          path: ArtBayPublisher.exe
