<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0c1122"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="funpayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5370"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>

    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f36" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e1526" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="glowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>

    <!-- Clip Paths -->
    <clipPath id="cardClip">
      <rect width="1280" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="1280" height="420" fill="url(#bgGrad)"/>

    <!-- Subtle Tech Grid -->
    <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
      <line x1="0" y1="60" x2="1280" y2="60"/>
      <line x1="0" y1="120" x2="1280" y2="120"/>
      <line x1="0" y1="180" x2="1280" y2="180"/>
      <line x1="0" y1="240" x2="1280" y2="240"/>
      <line x1="0" y1="300" x2="1280" y2="300"/>
      <line x1="0" y1="360" x2="1280" y2="360"/>
      <line x1="160" y1="0" x2="160" y2="420"/>
      <line x1="320" y1="0" x2="320" y2="420"/>
      <line x1="480" y1="0" x2="480" y2="420"/>
      <line x1="640" y1="0" x2="640" y2="420"/>
      <line x1="800" y1="0" x2="800" y2="420"/>
      <line x1="960" y1="0" x2="960" y2="420"/>
      <line x1="1120" y1="0" x2="1120" y2="420"/>
    </g>

    <!-- Ambient Glow Orbs -->
    <circle cx="140" cy="90" r="180" fill="#6366f1" opacity="0.22" filter="url(#glowPurple)"/>
    <circle cx="1120" cy="320" r="210" fill="#38bdf8" opacity="0.18" filter="url(#glowCyan)"/>
    <circle cx="950" cy="90" r="140" fill="#ff5370" opacity="0.14" filter="url(#glowPurple)"/>

    <!-- Circuit Waves -->
    <path d="M 40 380 Q 280 260 520 340 T 1000 220 T 1240 180" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" opacity="0.3"/>
    <path d="M -20 320 Q 220 200 460 280 T 940 160 T 1280 240" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2"/>

    <!-- Left Brand Icon Box -->
    <g transform="translate(85, 95)">
      <!-- Outer Glow Container -->
      <rect x="-4" y="-4" width="168" height="168" rx="38" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6"/>
      <rect width="160" height="160" rx="34" fill="url(#cardGrad)" stroke="#2a385f" stroke-width="1.5"/>

      <!-- Inner Holographic Shield / Logo Motif -->
      <g transform="translate(30, 28)">
        <!-- ArtBay Symbol / Robot / Hub -->
        <path d="M 50 12 L 85 32 L 85 72 L 50 92 L 15 72 L 15 32 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-linejoin="round"/>
        <path d="M 50 26 L 73 40 L 73 66 L 50 78 L 27 66 L 27 40 Z" fill="#6366f1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="50" cy="53" r="10" fill="url(#primaryGrad)"/>
        <circle cx="50" cy="53" r="16" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
        <!-- Connection pulses -->
        <circle cx="15" cy="52" r="3" fill="#38bdf8"/>
        <circle cx="85" cy="52" r="3" fill="#ff5370"/>
        <circle cx="50" cy="12" r="3" fill="#22c55e"/>
        <circle cx="50" cy="92" r="3" fill="#a855f7"/>
      </g>
    </g>

    <!-- Main Typography Header -->
    <g transform="translate(285, 95)">
      <!-- Top Pills / Badges -->
      <g transform="translate(0, 5)">
        <!-- Badge 1: Version -->
        <rect width="105" height="28" rx="14" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.2"/>
        <circle cx="14" cy="14" r="4" fill="#22c55e"/>
        <text x="25" y="19" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">v4.0.3 LIVE</text>

        <!-- Badge 2: Local First -->
        <g transform="translate(115, 0)">
          <rect width="115" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1.2"/>
          <text x="57" y="18.5" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">🏠 LOCAL-FIRST</text>
        </g>

        <!-- Badge 3: Architecture -->
        <g transform="translate(240, 0)">
          <rect width="130" height="28" rx="14" fill="#3b0764" stroke="#7e22ce" stroke-width="1.2"/>
          <text x="65" y="18.5" text-anchor="middle" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">⚡ FAST QUEUE</text>
        </g>
      </g>

      <!-- Main Title -->
      <text x="0" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
        ArtBay <tspan fill="url(#primaryGrad)">Publisher</tspan>
      </text>

      <!-- Subtitle -->
      <text x="2" y="116" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="19" font-weight="400" letter-spacing="0.2">
        High-Speed Telegram ↔ FunPay Automation Engine &amp; Bulk Manager
      </text>

      <!-- Feature Tags Row -->
      <g transform="translate(0, 142)">
        <g transform="translate(0, 0)">
          <rect width="128" height="34" rx="8" fill="#131c33" stroke="#23355e" stroke-width="1"/>
          <text x="64" y="22" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">📦 Bulk ZIP/JSON</text>
        </g>
        <g transform="translate(138, 0)">
          <rect width="132" height="34" rx="8" fill="#131c33" stroke="#23355e" stroke-width="1"/>
          <text x="66" y="22" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">⏯ Pause &amp; Resume</text>
        </g>
        <g transform="translate(280, 0)">
          <rect width="130" height="34" rx="8" fill="#131c33" stroke="#23355e" stroke-width="1"/>
          <text x="65" y="22" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🛡 Anti-Dupe Engine</text>
        </g>
        <g transform="translate(420, 0)">
          <rect width="118" height="34" rx="8" fill="#131c33" stroke="#23355e" stroke-width="1"/>
          <text x="59" y="22" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🖼 SHA256 Cache</text>
        </g>
      </g>
    </g>

    <!-- Right Side Flow Card Preview -->
    <g transform="translate(900, 85)">
      <!-- Card Panel -->
      <rect width="295" height="235" rx="20" fill="url(#cardGrad)" stroke="#223357" stroke-width="1.5"/>

      <!-- Header of Card -->
      <path d="M 0 20 C 0 8.954 8.954 0 20 0 L 275 0 C 286.046 0 295 8.954 295 20 L 295 44 L 0 44 Z" fill="#16223e"/>
      <circle cx="24" cy="22" r="5" fill="#ef4444"/>
      <circle cx="40" cy="22" r="5" fill="#eab308"/>
      <circle cx="56" cy="22" r="5" fill="#22c55e"/>
      <text x="147" y="27" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="12" font-weight="600">Bridge Pipeline</text>

      <!-- Flow Nodes Inside Card -->
      <!-- Telegram Node -->
      <g transform="translate(24, 62)">
        <rect width="247" height="38" rx="8" fill="#0c2340" stroke="#0284c7" stroke-width="1"/>
        <circle cx="20" cy="19" r="10" fill="url(#tgGrad)"/>
        <text x="20" y="23" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">TG</text>
        <text x="42" y="24" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Telegram Bot UI</text>
        <text x="235" y="24" text-anchor="end" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">ZIP / CMD</text>
      </g>

      <!-- Down Arrow 1 -->
      <path d="M 147 104 L 147 114" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,2"/>

      <!-- Localhost Core Node -->
      <g transform="translate(24, 118)">
        <rect width="247" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
        <circle cx="20" cy="21" r="10" fill="#4f46e5"/>
        <text x="20" y="25" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">⚡</text>
        <text x="42" y="22" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">ArtBay Core Engine</text>
        <text x="42" y="34" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">localhost:8765 · Checkpoint</text>
        <text x="235" y="26" text-anchor="end" fill="#4ade80" font-family="Consolas, monospace" font-size="11">ACTIVE</text>
      </g>

      <!-- Down Arrow 2 -->
      <path d="M 147 164 L 147 174" stroke="#ff5370" stroke-width="2" stroke-dasharray="3,2"/>

      <!-- FunPay Output Node -->
      <g transform="translate(24, 178)">
        <rect width="247" height="38" rx="8" fill="#3f0f1b" stroke="#e11d48" stroke-width="1"/>
        <circle cx="20" cy="19" r="10" fill="url(#funpayGrad)"/>
        <text x="20" y="23" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">FP</text>
        <text x="42" y="24" fill="#ffe4e6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">FunPay Marketplace</text>
        <text x="235" y="24" text-anchor="end" fill="#fb7185" font-family="Consolas, monospace" font-size="11">PUBLISHED</text>
      </g>
    </g>

    <!-- Bottom Footer Bar -->
    <rect y="375" width="1280" height="45" fill="#070b14" opacity="0.95"/>
    <line x1="0" y1="375" x2="1280" y2="375" stroke="#1e293b" stroke-width="1"/>
    
    <text x="85" y="403" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">
      ⚡ Developed by <tspan fill="#e2e8f0" font-weight="700">RovelLabs</tspan> · Built with <tspan fill="#00add8">Go</tspan> for High Performance &amp; Low Footprint
    </text>

    <text x="1195" y="403" text-anchor="end" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
      Source-Available License · Windows 10/11
    </text>
  </g>
</svg>
